name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # CI: runs on every push and pull request
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Python unit tests
        run: pytest -v

      - name: Create sample DuckDB database (no API key needed)
        run: python ci/make_sample_db.py

      - name: Build and test dbt models
        working-directory: dbt
        run: >
          dbt build --profiles-dir .
          --vars '{start_time: "2026-10-06 00:00:00", end_time: "2026-10-07 00:00:00"}'

      - name: Generate dbt documentation site
        working-directory: dbt
        run: >
          dbt docs generate --profiles-dir .
          --vars '{start_time: "2026-10-06 00:00:00", end_time: "2026-10-07 00:00:00"}'

      - name: Upload documentation as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dbt/target

  # CD: deploys the docs site, only after tests pass on main
  deploy-docs:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
